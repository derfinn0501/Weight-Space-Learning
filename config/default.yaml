seed: 42
device: "auto"

data:
  generator: "moons"
  M: 10
  N_train: 256
  N_test: 512
  input_dim: 2
  n_classes: 2
  noise: 0.1
  random_state_start: 1000
  centers: 2
  cluster_std: 1.0
  standardize: true

network:
  model_type: "mlp"
  input_dim: 2
  output_dim: 2
  hidden_layers: [32, 32]
  activation: "relu"
  epochs: 50
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0

image:
  representation: "block_matrix"
  include_input_data: false
  include_labels: true
  include_bias: true
  normalize: "none"

autoencoder:
  model_type: "cae"
  latent_dim: 32
  epochs: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  train_split: 0.8
  num_workers: 0
  checkpoint_every: 0

evaluation:
  save_reconstructions: true
  n_reconstruction_examples: 8
  save_latent_embeddings: true
  plot_format: "png"

# MLflow tracking
#
# The default URI points to the shared Raspberry Pi tracking server. Connect to
# the local network or WireGuard VPN before running experiments from outside the
# network. Use "http://127.0.0.1:5000" only when running a local MLflow server
# with scripts/start_mlflow_server.py.
mlflow:
  enabled: true
  tracking_uri: "http://192.168.178.25:5000"
  experiment_name: "weight-space-learning"
  run_name: "default"
  log_artifacts: true
  tags: {}

paths:
  data_root: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  model_zoo_dir: "data/model_zoo"
  weight_image_dir: "data/weight_images"
  result_dir: "data/results"
  autoencoder_dir: "data/results/autoencoders"
  figure_dir: "data/results/figures"
  metric_dir: "data/results/metrics"
  mlflow_backend_store: "data/mlflow/mlflow.db"
  mlflow_artifact_dir: "data/mlflow/artifacts"
